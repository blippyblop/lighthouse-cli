name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - goos: linux
            runs-on: ubuntu-latest
            cgo: "0"
          - goos: windows
            runs-on: ubuntu-latest
            cgo: "0"
          # go.bug.st/serial's darwin enumerator is cgo (IOKit), so darwin
          # must build on a macOS host with cgo enabled.
          - goos: darwin
            runs-on: macos-latest
            cgo: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
        run: |
          suffix=""
          [ "$GOOS" = "windows" ] && suffix=".exe"
          go build -trimpath -ldflags "-s -w" -o "lighthouse-cli-${GOOS}${suffix}" .

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: lighthouse-cli-${{ matrix.goos }}*
          fail_on_unmatched_files: true